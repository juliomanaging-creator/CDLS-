<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDLS Secure Grant Portal | Government Pilot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="h-3 w-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="text-xl font-bold tracking-tight text-white">CDLS Grant Portal <span class="text-xs px-2 py-0.5 bg-blue-900 text-blue-300 rounded border border-blue-700">Pilot v1.0</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="userRoleBadge" class="text-xs px-3 py-1 bg-slate-700 text-slate-300 rounded-full">Role: Admin</span>
            <button onclick="logout()" class="text-sm bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded transition">Secure Exit</button>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
        <div class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-semibold text-white">Active Pilot Grants</h2>
                <p class="text-sm text-slate-400">Secure institutional grant tracking with immutable audit trails.</p>
            </div>
            <button onclick="fetchGrants()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">Refresh Ledger</button>
        </div>

        <!-- Data Table Card -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                        <th class="px-6 py-4">Grant ID</th>
                        <th class="px-6 py-4">Project Title</th>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4 text-right">Allocated Funds</th>
                    </tr>
                </thead>
                <tbody id="grantTableBody" class="divide-y divide-slate-700 text-sm">
                    <!-- Dynamically Injected Rows -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Script Layer -->
    <script>
        async function fetchGrants() {
            try {
                // In production, attach Bearer token from secure sessionStorage
                const response = await fetch('/api/v1/grants', {
                    headers: { 'Authorization': 'Bearer pilot-admin-token' }
                });
                const data = await response.json();
                
                const tbody = document.getElementById('grantTableBody');
                tbody.innerHTML = '';
                
                data.grants.forEach(grant => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-700/30 transition">
                            <td class="px-6 py-4 font-mono text-emerald-400">${grant.id}</td>
                            <td class="px-6 py-4 font-medium text-white">${grant.title}</td>
                            <td class="px-6 py-4"><span class="px-2 py-1 bg-emerald-900/50 text-emerald-300 rounded text-xs border border-emerald-700">${grant.status}</span></td>
                            <td class="px-6 py-4 text-right font-mono text-slate-200">$${grant.allocated.toLocaleString()}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Failed to load grant ledger:", err);
            }
        }

        // Initialize on load
        fetchGrants();
    </script>
</body>
</html>
