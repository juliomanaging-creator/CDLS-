<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARCHITECT COMMAND PORTAL</title>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; padding: 50px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { border: 1px solid #00ff41; padding: 20px; background: #111; box-shadow: 0 0 10px #00ff41; }
        .btn { background: #00ff41; color: black; padding: 10px; text-decoration: none; display: inline-block; margin-top: 10px; font-weight: bold; cursor: pointer; border: none; }
        .btn:hover { background: white; }
        h1 { border-bottom: 2px solid #00ff41; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>SYSTEM OPERATIONAL: AIR-GAP SECURE</h1>
    <div class="grid">
        <div class="card">
            <h3>PROJECT JUDAS</h3>
            <p>Sovereign Audit: ACTIVE</p>
            <p>Variance: 0.00%</p>
            <a href="JULIO UMANZOR MEZA - Resume 2024 (1).pdf" class="btn">VIEW LOGS</a>
        </div>
        <div class="card" style="border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00;">
            <h3 style="color: #ffcc00;">CDLS FLEET</h3>
            <p>Target: 300,000 Units</p>
            <p>Market: Sacramento</p>
            <a href="#" class="btn" style="background: #ffcc00;">FLEET STATUS</a>
        </div>
        <div class="card" style="border-color: #ff3300; box-shadow: 0 0 10px #ff3300;">
            <h3 style="color: #ff3300;">IRON HALO</h3>
            <p>Mesh Status: READY</p>
            <p>Nodes: MONITORING</p>
            <button onclick="launchHalo()" class="btn" style="background: #ff3300; color: white;">LAUNCH HALO MESH</button>
        </div>
    </div>

    <script>
        function launchHalo() {
            alert("INITIATING HALO MESH... SCRAMBLING SHARDS...");
            // This hooks into your local python environment
            window.location.href = "/launch_halo"; 
        }
    </script>
</body>
</html>
