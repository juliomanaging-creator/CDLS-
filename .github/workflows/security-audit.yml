name: CDLS Automated Security Sentinel & Pipeline Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Full-Stack AppSec Audit (SAST, SCA, Secrets, IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Analysis Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit semgrep pip-audit detect-secrets pip-licenses

      - name: Run Unified Security Sentinel
        run: |
          python security_sentinel.py

      - name: Archive Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: SECURITY_AUDIT_REPORT.md
          retention-days: 30
