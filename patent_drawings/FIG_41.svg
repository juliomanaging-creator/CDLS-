    <text x="250" y="325" class="patent-subtext">Sheet: Julio - R&amp;D Tracker
Pr...</text>
    <text x="30" y="270" class="patent-num">416</text>
    <line x1="45" y1="270" x2="60" y2="280" class="patent-thin"/>

    <text x="250" y="470" class="patent-subtext">Dealer Dashboard — Phase 6: 48-Ho...</text>
    
  </g>

  <!-- Statutory Figure Designation -->
  <text x="408" y="930" class="fig-label">FIG. 41</text>
</svg>